services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel12-app

    working_dir: /var/www

    volumes:
      - ./:/var/www

    networks:
      - laravel

  nginx:
    image: nginx:alpine

    container_name: laravel12-nginx

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel

  mysql:
    image: mysql:8.4

    container_name: laravel12-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: testdb
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: 112277

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel

  redis:
    image: redis:alpine

    container_name: laravel12-redis

    ports:
      - "6379:6379"

    networks:
      - laravel

networks:
  laravel:

volumes:
  mysql_data:
