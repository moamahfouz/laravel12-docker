services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel12-app

    working_dir: /var/www

    volumes:
      - ./:/var/www

    networks:
      - laravel

  nginx:
    image: nginx:alpine

    container_name: laravel12-nginx

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel

  mysql:
    image: mysql:8.4

    container_name: laravel12-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: testdb
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: 112277

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel

  redis:
    image: redis:alpine

    container_name: laravel12-redis

    ports:
      - "6380:6379"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - laravel

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile

    container_name: laravel12-node

    ports:
      - "3000:3000"

    volumes:
      - ./node:/app
      - /app/node_modules

    networks:
      - laravel

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    command: php artisan queue:work

    volumes:
      - ./:/var/www

    depends_on:
      - redis
      - mysql

    networks:
      - laravel


  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    command: php artisan schedule:work

    volumes:
      - ./:/var/www

    depends_on:
      - redis
      - mysql

    networks:
      - laravel


networks:
  laravel:

volumes:
  mysql_data:
